version: "2"

run:
  timeout: '5m'
  tests: false
  build-tags:
    - all
  modules-download-mode: readonly
  allow-parallel-runners: true

linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - decorder
    - dogsled
    - dupword
    - durationcheck
    - errcheck
    - errorlint
    - copyloopvar
    - forcetypeassert
    - godot
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - makezero
    - misspell
    - nilerr
    - nilnil
    - noctx
    - paralleltest
    - prealloc
    - predeclared
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - usetesting
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
    - whitespace

  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go$
        linters:
          - containedctx
      - text: '^S1023:'
        linters:
          - staticcheck
      - text: '^SA3000:'
        linters:
          - staticcheck
      - text: '^G102:'
        linters:
          - gosec
      - text: '^G402:'
        linters:
          - gosec
      - text: '^G401:'
        linters:
          - gosec
      - text: '^G505:'
        linters:
          - gosec
      - text: '^G108:'
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

severity:
  default: error